<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Conception Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slateDeep: '#020617',
              glass: 'rgba(255,255,255,0.08)'
            },
            boxShadow: {
              glow: '0 0 45px rgba(56, 189, 248, 0.25)'
            },
            backdropBlur: {
              xl2: '24px'
            },
            keyframes: {
              shimmer: {
                '0%': { transform: 'translateX(120%)' },
                '100%': { transform: 'translateX(-120%)' }
              },
              float: {
                '0%,100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' }
              },
              fadeUp: {
                '0%': { opacity: 0, transform: 'translateY(16px)' },
                '100%': { opacity: 1, transform: 'translateY(0px)' }
              }
            },
            animation: {
              shimmer: 'shimmer 1.8s linear infinite',
              float: 'float 6s ease-in-out infinite',
              fadeUp: 'fadeUp .5s ease forwards'
            }
          }
        }
      };
    </script>
    <style>
      body {
        background: radial-gradient(circle at 0% 0%, rgba(14,165,233,0.15), transparent 40%), #020617;
      }
      .glass {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(24px);
      }
      .lit-hover {
        position: relative;
        overflow: hidden;
      }
      .lit-hover::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.12), transparent 65%);
        transform: translateX(120%);
      }
      .lit-hover:hover::after { animation: shimmer 1.2s linear; }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
